<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стипендиальный калькулятор</title>
    <!-- НОВЫЙ VK BRIDGE (вместо старого xd_that.js) -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge@latest/dist/browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 16px;
            padding-bottom: 100px;
        }
        .header { text-align: center; padding: 24px 0 16px; }
        .header h1 { font-size: 20px; margin-bottom: 4px; }
        .gpa-block, .section {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .gpa-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e3e6;
            border-radius: 10px;
            font-size: 18px;
        }
        .section-title {
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f2f5;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            gap: 10px;
        }
        .row-name { font-size: 13px; font-weight: 500; }
        .row-weight { font-size: 12px; color: #818c99; }
        .tapper {
            display: flex;
            align-items: center;
        }
        .tapper-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #e1e3e6;
            background: #f9f9f9;
            font-size: 20px;
            cursor: pointer;
        }
        .tapper-minus { border-radius: 8px 0 0 8px; }
        .tapper-plus { border-radius: 0 8px 8px 0; }
        .tapper-value {
            width: 44px;
            height: 36px;
            text-align: center;
            font-size: 16px;
            border-top: 2px solid #e1e3e6;
            border-bottom: 2px solid #e1e3e6;
        }
        .row-result {
            width: 60px;
            text-align: right;
            font-weight: 700;
            color: #2688eb;
        }
        .total-block {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        .total-value {
            font-size: 36px;
            font-weight: 800;
            color: #2688eb;
        }
        .total-formula { font-size: 11px; color: #818c99; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Стипендиальный калькулятор</h1>
        <p>ИНСЧХОЛ</p>
    </div>

    <div class="gpa-block">
        <label>Средний балл успеваемости</label>
        <input type="number" id="gpa" class="gpa-input" value="4.7" min="0" max="5" step="0.01">
    </div>

    <div class="section">
        <div class="section-title">📋 Участие в событиях</div>
        <div id="events-rows"></div>
    </div>

    <div class="section">
        <div class="section-title">🤝 Волонтёрство</div>
        <div id="volunteer-rows"></div>
    </div>

    <div class="total-block">
        <div class="total-value" id="total-score">0</div>
        <div class="total-formula" id="total-formula"></div>
    </div>

    <script>
        // Данные
        const eventsData = [
            { name: 'Факультетское / институтское', weight: 0.7, id: 'ev-faculty' },
            { name: 'Университетское / городское', weight: 1, id: 'ev-city' },
            { name: 'Региональное / межрегиональное', weight: 5, id: 'ev-region' },
            { name: 'Всероссийское', weight: 7, id: 'ev-russia' },
            { name: 'Международное', weight: 8, id: 'ev-world' },
        ];
        const volunteerData = [
            { name: 'Факультетское / институтское', weight: 0.5, id: 'vol-faculty' },
            { name: 'Университетское / городское', weight: 1, id: 'vol-city' },
            { name: 'Региональное / межрегиональное', weight: 1.5, id: 'vol-region' },
            { name: 'Всероссийское', weight: 2, id: 'vol-russia' },
            { name: 'Международное', weight: 2.5, id: 'vol-world' },
        ];

        const state = {};

        function createRow(item, containerId) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div><div class="row-name">${item.name}</div><div class="row-weight">Вес: ×${item.weight}</div></div>
                <div class="tapper">
                    <button class="tapper-btn tapper-minus" data-id="${item.id}">−</button>
                    <input type="number" class="tapper-value" data-id="${item.id}" value="0" min="0">
                    <button class="tapper-btn tapper-plus" data-id="${item.id}">+</button>
                </div>
                <div class="row-result" data-result="${item.id}">0</div>
            `;
            document.getElementById(containerId).appendChild(row);
        }

        function updateRowResult(id) {
            const item = [...eventsData, ...volunteerData].find(i => i.id === id);
            const count = state[id] || 0;
            const result = count * item.weight;
            const el = document.querySelector(`[data-result="${id}"]`);
            if (el) el.textContent = result % 1 === 0 ? result : result.toFixed(1);
        }

        function calculateTotal() {
            const gpa = parseFloat(document.getElementById('gpa').value) || 0;
            const coef = (gpa / 5) * 100;
            let sum = 0;
            [...eventsData, ...volunteerData].forEach(item => {
                sum += (state[item.id] || 0) * item.weight;
            });
            const total = sum * coef;
            document.getElementById('total-score').textContent = total % 1 === 0 ? total : total.toFixed(1);
            document.getElementById('total-formula').textContent = `Сумма (${sum.toFixed(1)}) × (${gpa}/5×100) = ${total.toFixed(1)}`;
        }

        function renderRows() {
            document.getElementById('events-rows').innerHTML = '';
            document.getElementById('volunteer-rows').innerHTML = '';
            eventsData.forEach(i => createRow(i, 'events-rows'));
            volunteerData.forEach(i => createRow(i, 'volunteer-rows'));
            document.querySelectorAll('.tapper-value').forEach(input => {
                const id = input.dataset.id;
                input.value = state[id] || 0;
            });
            [...eventsData, ...volunteerData].forEach(i => updateRowResult(i.id));
            calculateTotal();
        }

        // Обработчики
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.tapper-btn');
            if (!btn) return;
            const id = btn.dataset.id;
            const input = document.querySelector(`.tapper-value[data-id="${id}"]`);
            let val = parseInt(input.value) || 0;
            if (btn.classList.contains('tapper-plus')) val++;
            else if (btn.classList.contains('tapper-minus') && val > 0) val--;
            state[id] = val;
            input.value = val;
            updateRowResult(id);
            calculateTotal();
        });

        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('tapper-value')) {
                const id = e.target.dataset.id;
                let val = parseInt(e.target.value) || 0;
                if (val < 0) val = 0;
                state[id] = val;
                e.target.value = val;
                updateRowResult(id);
                calculateTotal();
            }
            if (e.target.id === 'gpa') {
                let val = parseFloat(e.target.value);
                if (val > 5) { val = 5; e.target.value = 5; }
                if (val < 0) { val = 0; e.target.value = 0; }
                calculateTotal();
            }
        });

        renderRows();

        // ✅ НОВАЯ ИНИЦИАЛИЗАЦИЯ ЧЕРЕЗ VK BRIDGE
        window.addEventListener('load', function() {
            if (window.vkBridge) {
                window.vkBridge.send('VKWebAppInit')
                    .then(() => console.log('✅ VK Mini App initialized'))
                    .catch(e => console.error('Init error:', e));
            } else {
                console.error('vkBridge not loaded');
            }
        });
    </script>
</body>
</html>
